# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/icon.png"

  android: "launcher_icon"
  image_path_android: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/icons/icon_background.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/icon_foreground.png"

  ios: true
  image_path_ios: "assets/icons/ios/icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icons/ios/icon_foreground.png"
  image_path_ios_tinted_grayscale: "assets/icons/ios/icon.png"
  desaturate_tinted_to_grayscale_ios: true

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
